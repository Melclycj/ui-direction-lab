<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Overview</title>
<style>
/* CORRECT rule-6 gating: the badge is DEFAULT-hidden and only shown while the link
   carries data-mock. After wiring (data-mock stripped) the badge reverts to
   display:none, so it is NOT visible — wire_navigation must NOT warn here even though
   the `.mock-tag` span is still physically present in the markup. This is the
   low-noise half of the finding-#4 fix: correctly-gated badges don't trip the WARN. */
.mock-tag { display: none; font-size: .7em; }
a[data-mock] .mock-tag { display: inline; }
a[data-mock] { opacity: .55; cursor: default; }
</style></head>
<body>
<h1>Overview</h1>
<a href="#" class="footer-nav__link" data-mock data-nav-target="detail" onclick="return false;" title="mocked">去详情<span class="mock-tag">mock</span></a>
</body></html>
